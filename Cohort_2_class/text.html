<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic" rel="stylesheet" />
    <link rel="stylesheet" href="text.css">
  

<style>
        p {
            font-family: 'Roboto', sans-serif;
            margin-top: 0;
            margin-bottom: 0;
        }

        .search-bar{
            font-size: 20px;
            display: block;
        }

        .suit {
            width: 300px;
        }

        .video-preview {
            display: inline-block;
            width: 300px;
            vertical-align: top;
            margin-right: 30px;
            border: 1px solid black;
        }

        .channel-picture {
            display: inline-block;
            width: 50px;
            vertical-align: top;
            
            
        }

        .video-info {
            display: inline-block;
            width: 200px;
            /* border: 1px solid black; */
            word-wrap: break-word;
            
        }

        .profile-pic1 {
            width: 40px;
            border-radius: 50%;
            height: 40px;
        }

        .vid-title {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .vid-author {
            font-size: 13px;
            color: rgb(96, 96, 96);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .vid-stats{
            font-size: 13px;
            color: rgb(96, 96, 96);
            font-weight: 500;
        }

        .thumbnail-row{
            margin-bottom: 7px;
        }

        .pop{
            color: rgb(96, 96, 96);
        }

    </style>
</head>



<body>

<input class="search-bar" type="text" placeholder="Search">

<div class="video-preview">

    <div class="thumbnail-row">
        <img src="img/thumbnail-1.webp" class="suit">
    </div>

    <div class="vid1-text">

        <div class="channel-picture">
            <img class="profile-pic1" src="img/marques.jfif">
        </div>

        <div class="video-info">

        <p class="vid-title">
        Talking tech and AI with Google CEO Sundar Pichai!
        </p>

        <p class="vid-author">
        Marques Brownlee
        </p>

        <p class="vid-stats">
        3.4M views &#183; 6 months ago
        </p>

        </div>
        
    </div>

</div>

<div class="video-preview">

    <div class="thumbnail-row">
        <img src="img/thumbnail-2.webp" class="suit">
    </div>

    <div class="vid1-text">

        <div class="channel-picture">
            <img class="profile-pic1" src="img/markiplier.jfif">
        </div>

        <div class="video-info">

        <p class="vid-title">
        Try Not To Laugh Challenge #9
        </p>

        <p class="vid-author">
        Markiplier
        </p>

        <p class="vid-stats">
        19M views &#183; 4 years ago
        </p>

        </div>
        
    </div>

</div>

            <div class="pop">Popular</div>

        </div>

        <div class="cat-follow">
            <button class="fol-btn">Follow</button>
        </div>
    </div>

    <div class="oliver-cat">

        <div class="cat-pfp">
            <img class="cat" src="img/download.jfif">
        </div>

        <div class="cat-name">

            <div class="olv">mimi</div>

            <div class="pop">Popular</div>

        </div>

        <div class="cat-follow">

        </div>
    </div>

    <div class="oliver-cat">

        <div class="cat-pfp">
            <img class="cat" src="img/bulldog.jfif">

        <div class="cat-name">

    </div>
</div>

</body>
</html>
